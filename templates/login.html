{% extends "base.html" %}
{% block title %}Inloggen - hebjijvoormij{% endblock %}
{% block content %}
<section class="login-box">
    <h2>Inloggen</h2>
    <form method="post">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label>E-mail <input type="email" name="email" value="{{ email or '' }}" required autofocus></label>
        <label>Wachtwoord <input type="password" name="password" required></label>
        <button type="submit">Inloggen</button>
    </form>
    <p class="hint">Nog geen account? <a href="{{ url_for('register') }}">Registreer jezelf</a> - de beheerder keurt het goed.</p>
</section>
{% endblock %}
