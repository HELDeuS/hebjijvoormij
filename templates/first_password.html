{% extends "base.html" %}
{% block title %}Wachtwoord kiezen - hebjijvoormij{% endblock %}
{% block content %}
<section class="login-box">
    <h2>Kies een wachtwoord</h2>
    <p class="hint">Je logt voor het eerst in: kies hieronder je eigen nieuwe wachtwoord (min. 6 tekens). De rest van de app wordt pas beschikbaar als dit is gelukt.</p>
    <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label>Nieuw wachtwoord <input type="password" name="new_password" minlength="6" required autofocus></label>
        <label>Herhaal nieuw wachtwoord <input type="password" name="confirm_password" minlength="6" required></label>
        <button type="submit">Opslaan</button>
    </form>
    <form method="post" action="{{ url_for('logout') }}" class="inline">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <button type="submit" class="reject">Annuleren</button>
    </form>
</section>
{% endblock %}
